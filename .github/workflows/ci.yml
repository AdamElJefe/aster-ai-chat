name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
        env:
          TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: OpenAPI contract drift
        run: |
          uv run python ../../scripts/export_openapi.py /tmp/openapi.json
          diff -u ../../packages/contracts/openapi.json /tmp/openapi.json
      - name: Dependency licenses (fail on strong copyleft in runtime deps)
        run: uv run pip-licenses --fail-on="GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
